name: tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (CPU)
        run: |
          pip install torch==2.1.0 torchvision==0.16.0 --index-url https://download.pytorch.org/whl/cpu
          pip install torch-scatter torch-sparse -f https://data.pyg.org/whl/torch-2.1.0+cpu.html  # reference SVFT in tests only
          pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check abra tests
      - name: Unit tests (tests needing released weights are skipped)
        run: pytest -q tests
