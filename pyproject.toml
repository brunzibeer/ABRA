[project]
name = "abra"
version = "0.1.0"
description = "ABRA: Teleporting Fine-Tuned Knowledge Across Domains for Open-Vocabulary Object Detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.1.0",
    "torchvision==0.16.0",
    "torchaudio==2.1.0",
    "scipy>=1.15.3",
    "timm>=1.0.27",
    "transformers==4.28.0",
    "numpy==1.24.0",
    "opencv-python>=4.8.1.78",
    "matplotlib>=3.7",
    "pycocotools>=2.0.11",
    "pyyaml>3.10",
    "jsonlines>=4.0.0",
    "tabulate>=0.10.0",
    "wandb>=0.28.0",
    "safetensors>=0.4",
    "setuptools<82.0.0",
]

[tool.uv]
python-preference = "managed"

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu118", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu118", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu118", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = ["pytest>=7"]
