[project]
name = "opengd-uv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.1.0",
    "torchvision==0.16.0",
    "torchaudio==2.1.0",
    "cython>=3.2.8",
    "submitit>=1.5.4",
    "scipy>=1.15.3",
    "termcolor>=3.3.0",
    "addict>=2.4.0",
    "yapf==0.40.1",
    "timm>=1.0.27",
    "transformers==4.28.0",
    "numpy==1.24.0",
    "opencv-python>=4.8.1.78",
    "supervision==0.6.0",
    "pycocotools>=2.0.11",
    "pyyaml>3.10",
    "colorlog>=6.10.1",
    "jsonlines>=4.0.0",
    "tabulate>=0.10.0",
    "wandb>=0.28.0",
    "setuptools<82.0.0",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
]

[tool.uv]
python-preference = "managed"
find-links = [
    "https://data.pyg.org/whl/torch-2.1.0+cu118.html"
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu118", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu118", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu118", marker = "sys_platform == 'linux'" }]

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch==2.1.0", "setuptools<82.0.0", "numpy==1.24.0"]
torch-sparse = ["torch==2.1.0", "setuptools<82.0.0", "numpy==1.24.0"]
